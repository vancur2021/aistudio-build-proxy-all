<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio 节点管理控制台</title>
    <!-- 引入 Tailwind CSS 作为基础样式设施，结合现代化的 font inter -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SVG 图标 -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0f172a; /* slate-900 */
                color: #e2e8f0; /* slate-200 */
            }
        }
        /* 拖拽边框动效 */
        .dropzone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
            .dropzone {
                border-color: #334155; /* slate-700 */
            }
        }
        .dropzone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        @media (prefers-color-scheme: dark) {
            .dropzone.dragover {
                border-color: #3b82f6;
                background-color: #1e293b; /* slate-800 */
            }
        }
        /* 运行中的呼吸灯 */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.running {
            background-color: #22c55e;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }
        .status-dot.stopped {
            background-color: #94a3b8;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
        /* 隐藏原生文件上传按钮 */
        input[type="file"] {
            display: none;
        }
        /* 卡片悬停提升效果 */
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* 模态框背景模糊 */
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="text-gray-800 dark:text-slate-200 antialiased min-h-screen flex flex-col relative transition-colors duration-300">

<!-- Cookie 编辑模态框 -->
<div id="cookie-edit-modal" class="fixed inset-0 z-[100] hidden modal-backdrop bg-slate-900/60 dark:bg-black/70 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="cookie-edit-modal-content">
        <div class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800">
            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                <i data-feather="edit-3" class="w-5 h-5 text-blue-600 dark:text-blue-400"></i>
                <span>编辑 Cookie: <span id="cookie-edit-title" class="font-mono text-sm text-slate-500 dark:text-slate-400"></span></span>
            </h3>
            <button onclick="closeCookieEditModal()" class="text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-lg transition-colors">
                <i data-feather="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="relative flex-grow overflow-hidden flex flex-col p-4 bg-slate-50 dark:bg-slate-900 min-h-[60vh]">
            <div id="cookie-edit-error" class="hidden mb-3 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-sm text-red-600 dark:text-red-400 flex items-start gap-2">
                <i data-feather="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <span id="cookie-edit-error-text"></span>
            </div>
            <textarea id="cookie-edit-textarea" class="w-full flex-grow p-4 font-mono text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none text-slate-700 dark:text-slate-300 shadow-inner" spellcheck="false" placeholder="正在加载..."></textarea>
        </div>
        
        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 flex justify-between items-center">
            <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                <i data-feather="info" class="w-3.5 h-3.5"></i>
                必须是合法的 JSON 格式
            </span>
            <div class="flex gap-3">
                <button onclick="closeCookieEditModal()" class="px-4 py-2 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-medium rounded-lg transition-colors shadow-sm">
                    取消
                </button>
                <button id="btn-save-cookie" onclick="saveCookieEdit()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm flex items-center gap-2">
                    <i data-feather="save" class="w-4 h-4"></i>
                    保存修改
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 截图预览模态框 -->
<div id="screenshot-modal" class="fixed inset-0 z-[100] hidden modal-backdrop bg-slate-900/60 dark:bg-black/70 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="screenshot-modal-content">
        <div class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800">
            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                <i data-feather="monitor" class="w-5 h-5 text-blue-600 dark:text-blue-400"></i>
                <span id="screenshot-title">节点截图预览</span>
            </h3>
            <button onclick="closeScreenshotModal()" class="text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-lg transition-colors">
                <i data-feather="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="relative bg-slate-100 dark:bg-slate-900 flex-grow overflow-auto p-4 flex items-center justify-center min-h-[300px]" id="screenshot-container">
            <!-- Loading Indicator -->
            <div id="screenshot-loading" class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 absolute inset-0 z-10 bg-slate-100/80 dark:bg-slate-900/80">
                <i data-feather="loader" class="w-8 h-8 animate-spin mb-3 text-blue-500 dark:text-blue-400"></i>
                <p class="font-medium text-sm animate-pulse">正在唤起浏览器截图并回传，请稍候...</p>
                <p class="text-xs mt-1 text-slate-500 dark:text-slate-400">这可能需要几秒到十几秒钟</p>
            </div>
            
            <!-- Real Image -->
            <img id="screenshot-img" class="max-w-full h-auto rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 hidden opacity-0 transition-opacity duration-500" src="" alt="Screenshot">
        </div>
        
        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 flex justify-end">
            <button onclick="closeScreenshotModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                关闭预览
            </button>
        </div>
    </div>
</div>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

    <!-- Node Board -->
    <div>
        <input type="file" id="cookie-upload" accept=".json" multiple onchange="handleFiles(this.files)">
        <div class="flex flex-wrap items-center justify-between mb-6 gap-4">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    节点管理控制台
                    <span class="text-sm font-normal text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-full ml-2">
                        活跃: <span id="active-count" class="font-bold text-slate-700 dark:text-slate-200">0</span>
                    </span>
                </h2>
                <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300 cursor-pointer hover:text-slate-800 dark:hover:text-slate-100 transition-colors bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                    <input type="checkbox" id="select-all" class="rounded border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-blue-600 focus:ring-blue-500 dark:focus:ring-offset-slate-900 w-4 h-4 cursor-pointer" onchange="toggleSelectAll(this)">
                    <span class="font-medium">全选</span>
                </label>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <!-- 隐藏手动启动按钮，避免与自动主备调度冲突 -->
                <!-- <button id="btn-start-selected" onclick="startSelected()" disabled class="text-sm bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 disabled:dark:bg-green-800 disabled:dark:text-slate-400">
                    <i data-feather="play" class="w-4 h-4"></i> <span id="btn-start-text">启动选中 (0)</span>
                </button> -->
                <button id="btn-refresh-selected" onclick="refreshSelected()" disabled class="text-sm bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 disabled:dark:bg-indigo-900 disabled:dark:text-slate-400">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i> <span id="btn-refresh-text">回刷选中 (0)</span>
                </button>
                <button id="btn-stop-selected" onclick="stopSelected()" disabled class="text-sm bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 disabled:dark:bg-red-900 disabled:dark:text-slate-400">
                    <i data-feather="square" class="w-4 h-4"></i> <span id="btn-stop-text">停止选中 (0)</span>
                </button>
                <!-- <button onclick="startAll()" class="text-sm bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <i data-feather="play-circle" class="w-4 h-4"></i> 全部启动
                </button> -->
            </div>
        </div>

        <!-- Cookies Grid -->
        <div id="nodes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading state -->
            <div class="col-span-full py-12 flex items-center justify-center flex-col text-slate-400 dark:text-slate-500">
                <i data-feather="loader" class="w-8 h-8 animate-spin mb-3"></i>
                <p>正在加载节点...</p>
            </div>
        </div>
    </div>
</main>

<script>
    // 初始化图标
    feather.replace();

    let availableCookies = [];
    let processStatus = {};
    let selectedNodes = new Set();
    let refreshingNodes = new Set(); // 记录正在执行回刷宏操作的节点

    window.onload = async function() {
        await fetchData();
        startStatusPolling();
    };

    async function req(url, options={}) {
        try {
            const res = await fetch('/api' + url, options);
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || 'Error');
            }
            return await res.json();
        } catch (e) {
            console.error("API Error: ", e);
            throw e;
        }
    }

    async function fetchData() {
        try {
            availableCookies = await req('/cookies') || [];
            processStatus = await req('/process/status') || {};
            renderNodes();
        } catch (e) {
            document.getElementById('nodes-grid').innerHTML = `
                <div class="col-span-full py-12 flex flex-col items-center justify-center text-red-400 bg-red-50 rounded-2xl border border-red-100">
                    <i data-feather="alert-circle" class="w-8 h-8 mb-3"></i>
                    <p class="font-medium">加载节点数据失败。</p>
                </div>
            `;
            feather.replace();
        }
    }

    function renderNodes() {
        const grid = document.getElementById('nodes-grid');
        let activeCount = 0;

        grid.innerHTML = '';

        // Add "Upload New Node" Card at the beginning
        const uploadCard = document.createElement('div');
        uploadCard.id = "dropzone";
        uploadCard.className = "dropzone bg-slate-50 dark:bg-slate-800/50 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-6 flex flex-col items-center justify-center cursor-pointer transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:border-blue-400 dark:hover:border-blue-500 min-h-[160px]";
        uploadCard.onclick = () => document.getElementById('cookie-upload').click();
        uploadCard.innerHTML = `
            <div class="bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 p-3 rounded-full mb-3 transition-colors">
                <i data-feather="plus" class="w-6 h-6"></i>
            </div>
            <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm mb-1 text-center">添加代理节点</h3>
            <p class="text-xs text-slate-400 dark:text-slate-500 text-center px-4">点击或拖拽 JSON 文件到此处</p>
        `;
        grid.appendChild(uploadCard);

        // Needs to re-bind drag & drop events to the new dynamically created element
        setupDragAndDrop(uploadCard);

        availableCookies.forEach(cookieFileName => {
            const status = processStatus[cookieFileName] || { running: false, connected: false, role: 'none' };
            const isRunning = status.running;
            const isConnected = status.connected;
            const role = status.role;
            
            if (role === 'active') activeCount++; // 只有 active 才能算作真正处理流量的节点
            
            // 构建卡片 HTML
            const card = document.createElement('div');
            // 卡片整体样式增加深色模式类
            
            const isRefreshing = refreshingNodes.has(cookieFileName);

            // 根据角色和回刷状态给卡片增加不同的边框高亮
            let cardBorderClass = "border-slate-200 dark:border-slate-700";
            if (isRefreshing) {
                cardBorderClass = "border-indigo-400 dark:border-indigo-500 shadow-md shadow-indigo-100 dark:shadow-indigo-900/20";
            } else if (role === 'active') {
                cardBorderClass = "border-green-400 dark:border-green-500 shadow-md shadow-green-100 dark:shadow-green-900/20";
            } else if (role === 'standby') {
                cardBorderClass = "border-blue-300 dark:border-blue-600 shadow-sm";
            }
            
            card.className = `bg-white dark:bg-slate-800 rounded-2xl border ${cardBorderClass} p-5 transition-all duration-300 card-hover flex flex-col h-full relative overflow-hidden`;
            
            // 角色/状态角标
            let roleBadgeHTML = '';
            if (isRefreshing) {
                roleBadgeHTML = `<div class="absolute top-0 right-0 bg-indigo-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg uppercase tracking-wider flex items-center gap-1"><i data-feather="refresh-cw" class="w-2.5 h-2.5 animate-spin"></i> 回刷中</div>`;
            } else if (role === 'active') {
                roleBadgeHTML = `<div class="absolute top-0 right-0 bg-green-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg uppercase tracking-wider">主节点</div>`;
            } else if (role === 'standby') {
                roleBadgeHTML = `<div class="absolute top-0 right-0 bg-blue-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg uppercase tracking-wider">备用节点</div>`;
            }

            // 样式处理
            let badgeClass = "bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-600";
            let badgeText = "已停止";
            let dotClass = "stopped dark:bg-slate-500";
            
            if (status.invalid_cookie) {
                badgeClass = "bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 border-red-300 dark:border-red-800";
                badgeText = "Cookie失效";
                dotClass = "stopped dark:bg-red-500";
            }
            
            let rateLimitedWarningHTML = '';
            // 处理 429 报错模型展示
            if (isRunning && status.rate_limited_models && status.rate_limited_models.length > 0) {
                const modelsText = status.rate_limited_models.map(item => item.model_name).join(', ');
                rateLimitedWarningHTML = `
                    <div class="mt-2 text-[11px] bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 px-2 py-1.5 rounded-md border border-red-100 dark:border-red-900/50 flex flex-col gap-1.5 break-all relative group">
                        <div class="flex items-center gap-1.5">
                            <i data-feather="alert-octagon" class="w-3.5 h-3.5 flex-shrink-0"></i>
                            <span>额度耗尽(429): <span class="font-medium">${modelsText}</span></span>
                        </div>
                        <div class="flex items-center justify-between text-[10px] text-red-500/80 dark:text-red-400/80">
                            <span>* 1h后自动恢复</span>
                            <button onclick="clearRateLimit('${cookieFileName}')" class="underline hover:text-red-600 dark:hover:text-red-300">强制清除重置</button>
                        </div>
                    </div>
                `;
            }

            if (isRunning) {
                if (isConnected) {
                    if (status.rate_limited_models && status.rate_limited_models.length > 0) {
                         badgeClass = "bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border-red-200 dark:border-red-800/60";
                         badgeText = "受限 (429)";
                    } else {
                         badgeClass = "bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-400 border-green-200 dark:border-green-800/60";
                         badgeText = "已连接";
                    }
                    dotClass = "running dark:bg-green-500 dark:shadow-[0_0_0_rgba(34,197,94,0.4)]";
                } else {
                    badgeClass = "bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border-blue-200 dark:border-blue-800/60";
                    badgeText = "启动中...";
                    dotClass = "running opacity-50 dark:bg-blue-400"; // 启动中状态给一个不同的视觉提示（半透明呼吸灯）
                }
            }
            
            const isChecked = selectedNodes.has(cookieFileName) ? 'checked' : '';

            card.innerHTML = `
                ${roleBadgeHTML}
                <div class="flex justify-between items-start mb-4 mt-1">
                    <div class="flex items-center gap-3 max-w-[70%]">
                        <input type="checkbox" class="node-checkbox rounded border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-blue-600 dark:text-blue-500 dark:focus:ring-offset-slate-900 w-4 h-4 cursor-pointer" 
                            ${isChecked}
                            onchange="toggleSelection('${cookieFileName}', this.checked)">
                        <span class="status-dot ${dotClass} flex-shrink-0"></span>
                        <h3 class="font-semibold text-slate-800 dark:text-slate-100 truncate text-sm" title="${cookieFileName}">
                            ${cookieFileName}
                        </h3>
                    </div>
                    <span class="text-[10px] font-medium px-2 py-1 rounded-md border ${badgeClass} inline-flex flex-shrink-0">
                        ${badgeText}
                    </span>
                </div>
                
                ${rateLimitedWarningHTML}
                
                <div class="mt-auto pt-4 flex gap-2 border-t border-slate-100 dark:border-slate-700">
                    ${isRunning ? `
                    <button onclick="toggleInstance('${cookieFileName}', ${isRunning})" 
                        class="flex-1 flex justify-center items-center gap-1.5 py-2 px-3 rounded-lg text-xs font-semibold transition-colors bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40">
                        <i data-feather="square" class="w-3.5 h-3.5"></i>
                        停止
                    </button>
                    <button onclick="reloadInstance('${cookieFileName}')" 
                        class="flex justify-center items-center py-2 px-3 rounded-lg text-xs font-medium bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors" title="刷新页面重连">
                        <i data-feather="refresh-cw" class="w-3.5 h-3.5"></i>
                    </button>
                    ` : `
                    <div class="flex-1 flex justify-center items-center gap-1.5 py-2 px-3 rounded-lg text-xs font-semibold text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800/50 cursor-not-allowed" title="系统自动调度，无需手动启动">
                        <i data-feather="clock" class="w-3.5 h-3.5"></i>
                        等待调度
                    </div>
                    `}
                    
                    ${isConnected ? `
                    <button onclick="openScreenshotModal('${cookieFileName}')" 
                        class="flex justify-center items-center py-2 px-3 rounded-lg text-xs font-medium bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-colors" title="获取页面截图">
                        <i data-feather="camera" class="w-3.5 h-3.5"></i>
                    </button>
                    ` : ''}

                    <button onclick="openCookieEditModal('${cookieFileName}')" 
                        class="flex justify-center items-center py-2 px-3 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-blue-500 dark:hover:text-blue-400 transition-colors" title="编辑 Cookie">
                        <i data-feather="edit-3" class="w-3.5 h-3.5"></i>
                    </button>

                    ${!isRunning ? `
                    <button onclick="deleteCookie('${cookieFileName}')" 
                        class="flex justify-center items-center py-2 px-3 rounded-lg text-xs font-medium text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-red-500 dark:hover:text-red-400 transition-colors" title="删除">
                        <i data-feather="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                    ` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        const activeCountEl = document.getElementById('active-count');
        if (activeCountEl) {
            activeCountEl.innerText = activeCount;
        }
        updateSelectAllState();
        updateActionButtons();
        feather.replace();
    }

    function toggleSelection(filename, isChecked) {
        if (isChecked) {
            selectedNodes.add(filename);
        } else {
            selectedNodes.delete(filename);
        }
        updateSelectAllState();
        updateActionButtons();
    }

    function toggleSelectAll(checkbox) {
        if (checkbox.checked) {
            availableCookies.forEach(file => selectedNodes.add(file));
        } else {
            selectedNodes.clear();
        }
        renderNodes();
    }

    function updateSelectAllState() {
        const selectAllCheckbox = document.getElementById('select-all');
        if (!selectAllCheckbox) return;
        
        if (availableCookies.length === 0) {
            selectAllCheckbox.checked = false;
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.disabled = true;
        } else {
            selectAllCheckbox.disabled = false;
            if (selectedNodes.size === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else if (selectedNodes.size === availableCookies.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }
    }

    function updateActionButtons() {
        const count = selectedNodes.size;
        const btnStop = document.getElementById('btn-stop-selected');
        const btnRefresh = document.getElementById('btn-refresh-selected');
        
        if (btnStop) {
            btnStop.disabled = count === 0;
            document.getElementById('btn-stop-text').innerText = `停止选中 (${count})`;
        }
        if (btnRefresh) {
            btnRefresh.disabled = count === 0;
            document.getElementById('btn-refresh-text').innerText = `回刷选中 (${count})`;
        }
    }

    async function startSelected() {
        if (selectedNodes.size === 0) return;
        const btnStart = document.getElementById('btn-start-selected');
        const textSpan = document.getElementById('btn-start-text');
        
        btnStart.disabled = true;
        textSpan.innerText = "正在启动...";

        for (const file of selectedNodes) {
            const isRun = processStatus[file]?.running;
            if (!isRun) {

                    await req(`/process/${file}/start`, { method: 'POST' });
                } catch(e) { console.error("Start error:", e); }

        }
        selectedNodes.clear();
        await fetchData();
    }

    async function stopSelected() {
        if (selectedNodes.size === 0) return;
        const btnStop = document.getElementById('btn-stop-selected');
        const textSpan = document.getElementById('btn-stop-text');
        
        btnStop.disabled = true;
        textSpan.innerText = "正在停止...";

        for (const file of selectedNodes) {
            const isRun = processStatus[file]?.running;
            if (isRun) {
                try {
                    await req(`/process/${file}/stop`, { method: 'POST' });
                } catch(e) { console.error("Stop error:", e); }
            }
        }
        selectedNodes.clear();
        await fetchData();
    }

    async function refreshSelected() {
        if (selectedNodes.size === 0) return;
        const btnRefresh = document.getElementById('btn-refresh-selected');
        const textSpan = document.getElementById('btn-refresh-text');
        
        btnRefresh.disabled = true;
        const originalText = textSpan.innerText;
        textSpan.innerText = "正在执行回刷...";

        let successCount = 0;
        let failCount = 0;

        // 辅助函数：等待节点变为 connected 状态
        const waitForConnected = async (filename, timeoutMs = 60000) => {
            const startTime = Date.now();
            while (Date.now() - startTime < timeoutMs) {
                try {
                    const statusMap = await req(`/process/status`);
                    const status = statusMap[filename];
                    if (status && status.running && status.connected) {
                        return true;
                    }
                } catch (e) {}
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            return false;
        };

        // 核心回刷逻辑封装为一个异步函数
        const processNode = async (file) => {
            // 标记为正在回刷并重绘
            refreshingNodes.add(file);
            renderNodes();

            const isRun = processStatus[file]?.running;
            if (isRun) {
                // 已经运行的节点，直接下发回刷指令
                try {
                    await req(`/process/${file}/refresh-cookie`, { method: 'POST' });
                    // 给一个短暂的视觉停留，让用户看到角标
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    successCount++;
                } catch(e) { 
                    console.error(`Refresh error for ${file}:`, e); 
                    failCount++;
                }
            } else {
                // 未运行的节点，执行宏操作：启动 -> 等待连接 -> 回刷 -> 等待 -> 停止
                try {
                    // 1. 启动节点
                    await req(`/process/${file}/start`, { method: 'POST' });
                    
                    // 2. 轮询等待连接成功 (最多等 60 秒)
                    const connected = await waitForConnected(file, 60000);
                    if (!connected) {
                        throw new Error("Timeout waiting for node to connect");
                    }
                    
                    // 3. 强制等待 15 秒
                    // 原因：Python 脚本在页面加载后有 time.sleep(10) 的硬编码等待，
                    // 必须等它度过这个休眠期并进入主循环，才能响应 trigger 文件。
                    // 实际上，进入主循环时 Python 会自动做一次初始保存。
                    await new Promise(resolve => setTimeout(resolve, 15000));
                    
                    // 4. 下发回刷指令 (作为双保险)
                    await req(`/process/${file}/refresh-cookie`, { method: 'POST' });
                    
                    // 5. 等待 8 秒，让 Python 脚本有时间轮询到 trigger 并写文件
                    // (Python 循环里有 time.sleep(2) 和拟人化滑动耗时)
                    await new Promise(resolve => setTimeout(resolve, 8000));
                    
                    successCount++;
                } catch(e) {
                    console.error(`Macro refresh error for ${file}:`, e);
                    failCount++;
                } finally {
                    // 6. 无论成功失败，最后都停止该节点，释放资源
                    try {
                        await req(`/process/${file}/stop`, { method: 'POST' });
                    } catch(e) {
                        console.error(`Failed to stop node ${file} after macro refresh:`, e);
                    }
                }
            }

            // 移除回刷标记并重绘
            refreshingNodes.delete(file);
            renderNodes();
        };

        // 动态并发控制池 (最大并发数 4)
        const concurrencyLimit = 4;
        const tasks = Array.from(selectedNodes);
        let currentIndex = 0;

        // Worker 函数：不断从队列中取任务执行，直到队列为空
        const worker = async () => {
            while (currentIndex < tasks.length) {
                const file = tasks[currentIndex++];
                await processNode(file);
            }
        };

        // 启动指定数量的 Worker
        const workers = [];
        for (let i = 0; i < Math.min(concurrencyLimit, tasks.length); i++) {
            workers.push(worker());
        }

        // 等待所有 Worker 完成工作
        await Promise.all(workers);
        
        // 恢复按钮状态 (静默完成，不打扰用户)
        selectedNodes.clear();
        updateSelectAllState();
        updateActionButtons();
        await fetchData(); // 刷新大盘状态
    }

    // 操作
    async function toggleInstance(filename, isRunning) {
        const action = isRunning ? 'stop' : 'start';
        try {
            await req(`/process/${filename}/${action}`, { method: 'POST' });

            // Error is handled in req
        }
        await fetchData();
    }

    async function reloadInstance(filename) {
        try {
            await req(`/process/${filename}/reload`, { method: 'POST' });
            // 刷新页面后，状态可能会短暂变为未连接，稍微延迟后刷新大盘
            setTimeout(fetchData, 1000);
        } catch (e) {
            console.error("Reload error:", e);
        }
    }

        if (!confirm(`确认删除 ${filename} 吗？`)) return;
        try {
            await req(`/cookies/${filename}`, { method: 'DELETE' });
        } catch (e) {}
        await fetchData();

    // -- Cookie 编辑功能 --
    let currentEditingCookie = "";

    async function openCookieEditModal(filename) {
        currentEditingCookie = filename;
        const modal = document.getElementById('cookie-edit-modal');
        const modalContent = document.getElementById('cookie-edit-modal-content');
        const title = document.getElementById('cookie-edit-title');
        const textarea = document.getElementById('cookie-edit-textarea');
        const errorBox = document.getElementById('cookie-edit-error');
        const btnSave = document.getElementById('btn-save-cookie');

        // Reset UI
        title.innerText = filename;
        textarea.value = "正在加载...";
        textarea.disabled = true;
        errorBox.classList.add('hidden');
        btnSave.disabled = true;

        // Show Modal
        modal.classList.remove('hidden');
        void modal.offsetWidth; // Trigger reflow
        modal.classList.remove('opacity-0');
        modal.classList.add('opacity-100');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');

        try {
            const content = await req(`/cookies/${filename}`);
            // 格式化 JSON
            textarea.value = JSON.stringify(content, null, 2);
            textarea.disabled = false;
            btnSave.disabled = false;
        } catch (e) {
            textarea.value = "";
            showCookieEditError("加载失败: " + e.message);
        }
    }

    function closeCookieEditModal() {
        const modal = document.getElementById('cookie-edit-modal');
        const modalContent = document.getElementById('cookie-edit-modal-content');
        
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            currentEditingCookie = "";
        }, 300);
    }

    function showCookieEditError(msg) {
        const errorBox = document.getElementById('cookie-edit-error');
        const errorText = document.getElementById('cookie-edit-error-text');
        errorText.innerText = msg;
        errorBox.classList.remove('hidden');
    }

    async function saveCookieEdit() {
        const textarea = document.getElementById('cookie-edit-textarea');
        const errorBox = document.getElementById('cookie-edit-error');
        const btnSave = document.getElementById('btn-save-cookie');
        const content = textarea.value.trim();

        errorBox.classList.add('hidden');

        if (!content) {
            showCookieEditError("内容不能为空");
            return;
        }

        // 前端校验 JSON 格式
        try {
            JSON.parse(content);
        } catch (e) {
            showCookieEditError("JSON 格式错误: " + e.message);
            return;
        }

        btnSave.disabled = true;
        const originalText = btnSave.innerHTML;
        btnSave.innerHTML = `<i data-feather="loader" class="w-4 h-4 animate-spin"></i> 保存中...`;
        feather.replace();

        try {
            await req(`/cookies/${currentEditingCookie}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: content
            });
            
            closeCookieEditModal();
            
            // 检查该节点是否正在运行，如果是，提示用户重启
            const isRun = processStatus[currentEditingCookie]?.running;
            if (isRun) {
                setTimeout(() => {
                    alert(`Cookie [${currentEditingCookie}] 已保存成功。\n\n注意：该节点目前正在运行，新 Cookie 不会自动生效。请手动停止并重新启动该节点。`);
                }, 350);
            }
            
            await fetchData();
        } catch (e) {
            showCookieEditError("保存失败: " + e.message);
        } finally {
            btnSave.disabled = false;
            btnSave.innerHTML = originalText;
            feather.replace();
        }
    }

    // -- 截图相关功能 --
    let screenshotPollingInterval = null;

    function openScreenshotModal(filename) {
        const modal = document.getElementById('screenshot-modal');
        const modalContent = document.getElementById('screenshot-modal-content');
        const title = document.getElementById('screenshot-title');
        const img = document.getElementById('screenshot-img');
        const loading = document.getElementById('screenshot-loading');

        // Reset UI
        title.innerText = filename + " 运行快照";
        img.src = "";
        img.classList.add('hidden');
        img.classList.remove('opacity-100');
        img.classList.add('opacity-0');
        loading.classList.remove('hidden');

        // Show Modal
        modal.classList.remove('hidden');
        // Trigger reflow for animation
        void modal.offsetWidth;
        modal.classList.remove('opacity-0');
        modal.classList.add('opacity-100');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');

        // 发起截图请求
        fetchScreenshot(filename);
    }

    function closeScreenshotModal() {
        const modal = document.getElementById('screenshot-modal');
        const modalContent = document.getElementById('screenshot-modal-content');
        
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        
        // Wait for animation to finish
        setTimeout(() => {
            modal.classList.add('hidden');
            document.getElementById('screenshot-img').src = ""; // free memory
        }, 300);
    }

    async function fetchScreenshot(filename) {
        try {
            // 直接发起 GET 请求，后端会阻塞等待截图完成并返回图片流
            // 加上时间戳防止浏览器缓存
            const url = `/api/process/${encodeURIComponent(filename)}/screenshot?_t=${Date.now()}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || "获取截图异常");
            }
            
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            
            const img = document.getElementById('screenshot-img');
            const loading = document.getElementById('screenshot-loading');
            
            img.onload = () => {
                loading.classList.add('hidden');
                img.classList.remove('hidden');
                // Trigger reflow
                void img.offsetWidth;
                img.classList.remove('opacity-0');
                img.classList.add('opacity-100');
                // Clean up object URL after a while to prevent memory leaks if modal is closed rapidly
                setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
            };
            img.src = objectUrl;
            
        } catch (error) {
            console.error("Screenshot error:", error);
            const loading = document.getElementById('screenshot-loading');
            loading.innerHTML = `
                <i data-feather="alert-triangle" class="w-8 h-8 mb-3 text-red-500"></i>
                <p class="font-medium text-red-600">无法获取截图</p>
                <p class="text-xs mt-1 text-slate-500 text-center max-w-sm">${error.message}</p>
            `;
            feather.replace();
        }
    }

    async function startAll() {
        // Find all stopped files and start them
        for (const file of availableCookies) {
            const isRun = processStatus[file]?.running;
            if (!isRun) {
                try {
                    await req(`/process/${file}/start`, { method: 'POST' });
                } catch(e) { console.error("Start error:", e); }
            }
        }
        await fetchData();
    }

    function startStatusPolling() {
        setInterval(async () => {
            try {
                processStatus = await req(`/process/status`) || {};
                renderNodes();
            } catch (e) {}
        }, 3000);
    }

    // 拖拽上传逻辑
    function setupDragAndDrop(dropzoneEl) {
        if (!dropzoneEl) return;
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzoneEl.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzoneEl.addEventListener(eventName, () => {
                dropzoneEl.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzoneEl.addEventListener(eventName, () => {
                dropzoneEl.classList.remove('dragover');
            }, false);
        });

        dropzoneEl.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }, false);
    }

    async function handleFiles(files) {
        if (!files || files.length === 0) return;
        
        // 可上传多个文件
        for(let i=0; i<files.length; i++) {
            const file = files[i];
            if (!file.name.endsWith('.json')) {
                alert(`文件 ${file.name} 不是 JSON 文件，已跳过。`);
                continue;
            }
            
            const formData = new FormData();
            formData.append("file", file);
            
            try {
                await fetch('/api/cookies/upload', { method: 'POST', body: formData });
            } catch(e) {
                console.error("Upload error", e);
            }
        }
        
        document.getElementById('cookie-upload').value = '';
        await fetchData();
    }
